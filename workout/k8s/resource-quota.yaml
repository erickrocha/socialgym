apiVersion: v1
kind: ResourceQuota
metadata:
  name: workout-app-quota
  namespace: workout-app
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 10Gi
    limits.cpu: "20"
    limits.memory: 20Gi
    pods: "50"
    services: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workout-app-limits
  namespace: workout-app
spec:
  limits:
    - max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "3"
        memory: "3Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      type: Pod


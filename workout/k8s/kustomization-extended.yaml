apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workout-app

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - cloudfront-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - resource-quota.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/name: workout-app
  app.kubernetes.io/instance: production
  app.kubernetes.io/version: v1.0.0
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: workout-system
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  description: "Workout Application API"
  owner: "DevOps Team"
  documentation: "https://github.com/your-repo/workout/DEPLOYMENT.md"

images:
  - name: workout-app
    newName: your-registry/workout-app
    newTag: latest


apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workout-app-network-policy
  namespace: workout-app
spec:
  podSelector:
    matchLabels:
      app: workout-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8090
    # Allow probes
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8090
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound to externally managed PostgreSQL/PostGIS
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Allow outbound HTTPS (for S3, APIs, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Allow outbound HTTP (if needed)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80

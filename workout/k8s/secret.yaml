apiVersion: v1
kind: Secret
metadata:
  name: workout-secrets
  namespace: workout-app
type: Opaque
stringData:
  # Placeholders only - never commit real values here. Inject the real
  # secret out-of-band at deploy time (e.g. `kubectl create secret` from a
  # CI secret store, or `kustomize edit set secret`), the same way the
  # infra/*/.env.example files use CHANGE_ME rather than a real value.
  DATABASE_URL: "postgresql://workout:CHANGE_ME@postgres.example.internal:5432/workout"
  ACCESS_TOKEN_SECRET: "CHANGE_ME"
  REFRESH_TOKEN_SECRET: "CHANGE_ME"
  AWS_REGION: "us-east-1"
  AWS_BUCKET: "your-s3-bucket-name"

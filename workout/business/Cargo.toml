[package]
name = "business"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { workspace = true }
uuid = {workspace = true}
utoipa = { workspace = true }
entity = { path = "../entity" }
bcrypt = "0.19.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
log = "0.4.33"

serde = { version = "1.0.229", features = ["derive"] }
aws-config = { version = "1.10.1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sqs = { version = "1.105.0", default-features = false, features = ["rt-tokio", "rustls"] }
cloudfront_sign = "0.4.1"
serde_json = "1.0.151"
urlencoding = "2.1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dependencies.sea-orm]
version = "2.0.2"
features = [
    "debug-print",
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "with-uuid",
    "with-chrono"
]

[dev-dependencies]
tokio = { workspace = true }
migration = { path = "../migration" }

[features]
mock = ["sea-orm/mock"]


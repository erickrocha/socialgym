[package]
name = "business"
version = "0.1.0"
edition = "2021"

[dependencies]
fluent-templates = "0.15.1"
unic-langid = { version = "0.9", features = ["macros"] }
chrono = { workspace = true }
uuid = {workspace = true}
utoipa = { workspace = true }
entity = { path = "../entity" }
bcrypt = "0.19.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
log = "0.4.33"

serde = { version = "1.0.229", features = ["derive"] }
aws-config = { version = "1.10.1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1.105.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
cloudfront_sign = "0.4.1"
serde_json = "1.0.151"
urlencoding = "2.1.3"
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
prost = "0.14.4"
tonic-prost = "0.14.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

[dependencies.sea-orm]
version = "2.0.2"
features = [
    "debug-print",
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "with-uuid",
    "with-chrono"
]

[build-dependencies]
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
migration = { path = "../migration" }

[features]
mock = ["sea-orm/mock"]


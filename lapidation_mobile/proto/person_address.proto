syntax = "proto3";
package grpc.person_address;

message PersonAddress {
  int32 id = 1;
  string uuid = 2;
  int32 person_id = 3;
  string address_line_1 = 4;
  string address_line_2 = 5;
  string locality = 6;
  string administrative_area = 7;
  string postal_code = 8;
  string country_code = 9;
  optional double latitude = 10;
  optional double longitude = 11;
  bool current = 12;
  string created_at = 13;
  string updated_at = 14;
}

name: Deploy SocialGym Mobile

on:
  push:
    branches: [main]
    paths:
      - "socialgym_mobile/**"
      - ".github/workflows/socialgym-mobile-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-socialgym-mobile
  cancel-in-progress: false

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: socialgym_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: socialgym_mobile
        run: flutter analyze

      - name: Test
        working-directory: socialgym_mobile
        run: flutter test

      - name: Build debug APK (unsigned validation build)
        working-directory: socialgym_mobile
        run: flutter build apk --debug

  test-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: socialgym_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: socialgym_mobile
        run: flutter analyze

      - name: Test
        working-directory: socialgym_mobile
        run: flutter test

      - name: Build unsigned iOS app (validation build)
        working-directory: socialgym_mobile
        run: flutter build ios --no-codesign --debug

  deploy-android:
    needs: test-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        working-directory: socialgym_mobile
        run: flutter pub get

      - name: Decode release keystore
        working-directory: socialgym_mobile/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: socialgym_mobile/android
        run: |
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: socialgym_mobile
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUP }}
          file: socialgym_mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing material
        if: always()
        working-directory: socialgym_mobile/android
        run: rm -f app/upload-keystore.jks key.properties

  deploy-ios:
    needs: test-ios
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: socialgym_mobile
        run: flutter pub get

      - name: Import distribution certificate
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile and configure signing
        working-directory: socialgym_mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 -d > /tmp/socialgym.mobileprovision
          security cms -D -i /tmp/socialgym.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp /tmp/socialgym.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/"$UUID".mobileprovision
          cat >> ios/Flutter/Release.xcconfig <<EOF
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $NAME
          EOF
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" \
            -c "Set :provisioningProfiles:com.erocha.socialgym $NAME" ios/ExportOptions.plist

      - name: Build signed IPA
        working-directory: socialgym_mobile
        run: flutter build ipa --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} --export-options-plist=ios/ExportOptions.plist

      - name: Locate signed IPA
        id: ipa
        run: |
          set -euo pipefail
          IPA_PATH=$(ls socialgym_mobile/build/ios/ipa/*.ipa | head -n 1)
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

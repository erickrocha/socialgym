syntax = "proto3";
package grpc.business_profile_address;

message BusinessProfileAddress {
  int32 id = 1;
  string uuid = 2;
  int32 business_profile_id = 3;
  string address_line_1 = 4;
  string address_line_2 = 5;
  string locality = 6;
  string administrative_area = 7;
  string postal_code = 8;
  string country_code = 9;
  double latitude = 10;
  double longitude = 11;
  string created_at = 12;
  string updated_at = 13;
}


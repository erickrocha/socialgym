syntax = "proto3";
package grpc.workout;

import "exercise.proto";
import "google/protobuf/empty.proto";

message Workout {
  int32 id = 1;
  string uuid = 2;
  int32 owner_id = 3;
  string owner_uuid = 4;
  string name = 5;
  string description = 6;
  string difficulty = 7;
  string muscle_group = 8;
  string visibility = 9;
  repeated grpc.exercise.Exercise exercises = 10;
  string created_at = 11;
  string updated_at = 12;
  // Only used on AddWorkout, by a caller acting as a business profile, to
  // create the workout owned by this team member instead of the profile
  // itself. Requires an Accepted `team_members` relationship. Empty = normal
  // ownership (the acting identity).
  string target_person_uuid = 13;
  // Consent state: "Pending" / "Accepted" / "Rejected" / "Cancelled".
  // Response-only — ignored on AddWorkout/UpdateWorkout.
  string status = 14;
  // The business profile that assigned this workout (team-member assignment
  // only). Response-only.
  string assigned_by_profile_uuid = 15;
}

service WorkoutService {
  rpc GetWorkout (WorkoutRequest) returns (Workout);
  rpc GetWorkoutsByOwner (WorkoutListRequest) returns (WorkoutResponse);
  rpc AddWorkout(Workout) returns (Workout);
  rpc UpdateWorkout(Workout) returns (Workout);
  rpc DeleteWorkout(WorkoutRequest) returns (google.protobuf.Empty);
  rpc AddExercisesToWorkout(WorkoutExercisesRequest) returns (Workout);
  // Team-member assignment lifecycle. Accept/Reject are for the assigned
  // person; Cancel is for the assigning business profile.
  rpc AcceptWorkout(WorkoutRequest) returns (Workout);
  rpc RejectWorkout(WorkoutRequest) returns (Workout);
  rpc CancelWorkout(WorkoutRequest) returns (Workout);
}

message WorkoutRequest {
  oneof identifier {
    int32 id = 1;
    string uuid = 2;
  }
}

message WorkoutExercisesRequest {
  string workout_uuid = 1;
  repeated grpc.exercise.Exercise exercises = 2;
}

message WorkoutListRequest {
  oneof identifier {
    int32 owner_id = 1;
    string owner_uuid = 2;
  }
}

message WorkoutResponse {
  repeated Workout workouts = 1;
}


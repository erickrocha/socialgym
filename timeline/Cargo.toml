[package]
name = "timeline"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["application", "domain", "business", "integration"]

[dependencies]
application = { path = "application" }
integration = { path = "integration" }
business = { path = "business" }
tokio = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = "0.3.23"
anyhow = "1.0.102"
log = "0.4.29"

[workspace.dependencies]
mongodb = "3.7.0"
dotenvy = "0.15.7"
utoipa = { version = "^6.0.0", features = ["axum_extras", "chrono"] } # Or your desired utoipa version
utoipa-swagger-ui = { version = "^10.0.1", features = ["axum", "vendored"] }
tokio = { version = "1.52.3", features = ["full"] }
tonic = { version = "0.14.6",features = ["transport", "tls-ring"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.150"
uuid = "1.23.4"

# Keeps backtraces with line numbers but drops full debug info (the bulk of target/debug).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

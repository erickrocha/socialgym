syntax = "proto3";
package grpc.resource;
import "country.proto";
import "settings.proto";
service ResourceService{
  rpc GetResource(ResourceRequest) returns (ResourceResponse);
}

message ResourceRequest {
  oneof identifier {
    int32 userId = 1;
    string ownerUuid = 2;
  }
}

message ResourceResponse {
  repeated country.Country countries = 1;
  settings.Setting setting = 2;
}

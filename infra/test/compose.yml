services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: workout_test
      POSTGRES_USER: workout_test
      POSTGRES_PASSWORD: workout_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_test -d workout_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root_test
      MONGO_INITDB_ROOT_PASSWORD: root_test
      MONGODB_USERNAME: timeline_test
      MONGODB_PASSWORD: timeline_test
      MONGODB_DATABASE: timeline_test
    ports:
      - "37017:27017"
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh mongodb://root_test:root_test@localhost:27017/admin --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  workout:
    build:
      context: ../../workout
      dockerfile: Dockerfile
    ports:
      - "18090:8090"
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      DATABASE_NAME: workout_test
      DATABASE_URL: postgresql://workout_test:workout_test@postgres:5432/workout_test
      ACCESS_TOKEN_SECRET: c005-test-secret
      REFRESH_TOKEN_SECRET: c005-refresh-secret
      TERMS_VERSION: 1.0.0
      PRIVACY_VERSION: 1.0.0
      HEALTH_DATA_CONSENT_VERSION: 1.0.0
      AWS_REGION: us-east-1
      AWS_WORKOUT_BUCKET: test-bucket
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_SQS_QUEUE_URL: http://localhost/test
      CLOUDFRONT_KEY_PAIR_ID: test
      CLOUDFRONT_DOMAIN: https://example.test
      PRIVATE_KEY_RAW: test
      INTERNAL_SERVICE_SECRET: c005-internal-secret
      TIMELINE_BASE_URL: http://timeline:8091
      AUTH_RULES_ENABLED: "false"
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  integration:
    build:
      context: ../../workout
      dockerfile: integration/Dockerfile
    ports:
      - "18501:50051"
    environment:
      DATABASE_URL: postgresql://workout_test:workout_test@postgres:5432/workout_test
      HOST: 0.0.0.0
      GRPC_PORT: 50051
      TLS_CERT_PATH: /etc/grpc/certs/server.crt
      TLS_KEY_PATH: /etc/grpc/certs/server.key
      AWS_REGION: us-east-1
      AWS_WORKOUT_BUCKET: test-bucket
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CLOUDFRONT_KEY_PAIR_ID: test
      CLOUDFRONT_DOMAIN: https://example.test
      PRIVATE_KEY_RAW: test
      ACCESS_TOKEN_SECRET: c005-test-secret
      REFRESH_TOKEN_SECRET: c005-refresh-secret
      RUST_LOG: info
    volumes:
      - ./certs/server.crt:/etc/grpc/certs/server.crt:ro
      - ./certs/server.key:/etc/grpc/certs/server.key:ro
    depends_on:
      postgres:
        condition: service_healthy

  timeline:
    build:
      context: ../../timeline
      dockerfile: Dockerfile
    ports:
      - "18091:8091"
    environment:
      HOST: 0.0.0.0
      PORT: 8091
      DATABASE_NAME: timeline_test
      DATABASE_URL: mongodb://timeline_test:timeline_test@mongo:27017/timeline_test?authSource=timeline_test
      ACCESS_TOKEN_SECRET: c005-test-secret
      REFRESH_TOKEN_SECRET: c005-refresh-secret
      AWS_REGION: us-east-1
      AWS_WORKOUT_BUCKET: test-bucket
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CLOUDFRONT_KEY_PAIR_ID: test
      CLOUDFRONT_DOMAIN: https://example.test
      PRIVATE_KEY_RAW: test
      GRPC_PROTOCOL: https
      GRPC_HOST: integration
      GRPC_DOMAIN_NAME: integration
      GRPC_PORT: 50051
      GRPC_USE_TLS: "true"
      GRPC_CERT_PATH: /etc/grpc/certs/server.crt
      INTERNAL_SERVICE_SECRET: c005-internal-secret
      RUST_LOG: info
    volumes:
      - ./certs/server.crt:/etc/grpc/certs/server.crt:ro
    depends_on:
      mongo:
        condition: service_healthy
      integration:
        condition: service_started

networks:
  default:
    name: socialgym-test

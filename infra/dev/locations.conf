# Rotas compartilhadas entre o listener TLS (443) e o listener cleartext h2c (8080).
# Incluído por ambos os server blocks em nginx.conf — mantenha as rotas só aqui
# para os dois listeners nunca divergirem.
#
# X-Forwarded-Proto usa $forwarded_proto (definido via map em nginx.conf) em vez de
# $scheme: no listener 8080 o $scheme é "http", mas o cliente falou https com o
# ngrok, que repassa o valor original no header.

# Rota para o microserviço atual (Workout)
location /login {
    proxy_pass http://login_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
}


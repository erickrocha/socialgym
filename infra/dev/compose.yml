services:
#   --- GATEWAY (INGRESS) ---
  gateway:
    image: nginx:alpine
    container_name: workout_dev_gateway
    ports:
      - '80:80'
      - '443:443'
      # Listener cleartext h2c — upstream do ngrok (ver nginx.conf)
      - '8080:8080'
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./locations.conf:/etc/nginx/locations.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workout-dev-network

  postgres:
    image: postgis/postgis:18-3.6
    container_name: workout_dev_postgres
    environment:
      - POSTGRES_DB=${WORKOUT_DATABASE_NAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${WORKOUT_PASSWORD}}
      - POSTGRES_USER=${POSTGRES_USER:-${WORKOUT_USERNAME:-workout}}
    ports:
      - '5432:5432'
    networks:
      - workout-dev-network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    hostname: mongo_database
    image: mongo:8.2
    container_name: mongo_database_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_USERNAME: ${MONGO_USERNAME}
      MONGODB_PASSWORD: ${MONGO_PASSWORD}
      MONGODB_DATABASE: ${MONGO_DATABASE_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - workout-dev-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  workout-dev-network:
    driver: bridge

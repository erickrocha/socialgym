events { worker_connections 1024; }

http {
    # Configurações básicas
    sendfile on;

    # Preserva o X-Forwarded-Proto que o ngrok manda; cai para $scheme quando a
    # requisição vem direta (LAN / localhost). Usado em locations.conf.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # WebSocket upgrade plumbing for the chat socket (/timeline/api/chat/ws).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream workout_service {
        server host.docker.internal:8090;
    }

    # Exemplo de como você adicionaria o novo microserviço futuramente
    upstream timeline_service {
       server host.docker.internal:8091;
    }

    upstream login_service {
       server host.docker.internal:8090;
    }

    # Servidor gRPC Tonic: crate `integration`, não o workout-app.
    upstream grpc_integration_service {
        server host.docker.internal:50051; # Porta onde o gRPC do Rust está ouvindo
    }

    server {
        listen 80;
        listen [::]:80;
        server_name 192.168.15.4 scrutiny-elevator-washstand.ngrok-free.dev localhost;

        return 301 https://$host$request_uri;
    }

    # Listener cleartext h2c — é o upstream do ngrok.
    #
    # O ngrok encaminha HTTP/2 para o upstream como h2c (cleartext, prior
    # knowledge), então este listener NÃO pode ser TLS. O TLS continua sendo
    # terminado na borda do ngrok; só o salto em loopback é cleartext.
    #
    # Não redirecione para https aqui: o cliente já falou https com o ngrok, e o
    # redirect voltaria para esta mesma porta, em loop.
    server {
        listen 8080;
        listen [::]:8080;
        http2 on;   # aceita h2c prior-knowledge e também HTTP/1.1

        server_name _;

        include /etc/nginx/locations.conf;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;   # obrigatório para gRPC: sem isso o ALPN só oferece http/1.1

        server_name 192.168.15.4 scrutiny-elevator-washstand.ngrok-free.dev localhost;

        # Caminhos dos certificados dentro do contêiner do Nginx (ou da sua máquina Linux)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Configurações recomendadas de segurança para o TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        include /etc/nginx/locations.conf;
    }
}

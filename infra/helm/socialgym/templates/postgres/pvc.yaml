apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}

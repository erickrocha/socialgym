apiVersion: v1
kind: Secret
metadata:
  name: mongo
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
type: Opaque
data:
  MONGO_ROOT_PASSWORD: {{ include "socialgym.secretValue" (list . "mongo" "MONGO_ROOT_PASSWORD" .Values.mongo.rootPassword 24) | b64enc }}
  MONGO_APP_PASSWORD: {{ include "socialgym.secretValue" (list . "mongo" "MONGO_APP_PASSWORD" .Values.mongo.appPassword 24) | b64enc }}

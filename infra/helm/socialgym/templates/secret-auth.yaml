apiVersion: v1
kind: Secret
metadata:
  name: socialgym-auth
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
type: Opaque
data:
  ACCESS_TOKEN_SECRET: {{ include "socialgym.secretValue" (list . "socialgym-auth" "ACCESS_TOKEN_SECRET" .Values.auth.accessTokenSecret 64) | b64enc }}
  REFRESH_TOKEN_SECRET: {{ include "socialgym.secretValue" (list . "socialgym-auth" "REFRESH_TOKEN_SECRET" .Values.auth.refreshTokenSecret 64) | b64enc }}

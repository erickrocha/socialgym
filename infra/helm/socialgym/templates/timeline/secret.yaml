apiVersion: v1
kind: Secret
metadata:
  name: timeline
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Empty by default - see workout's secret.yaml note; same AWS limitation applies here.
  AWS_ACCESS_KEY_ID: {{ .Values.timeline.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.timeline.aws.secretAccessKey | quote }}
  PRIVATE_KEY_RAW: {{ .Values.timeline.aws.privateKeyRaw | quote }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: timeline
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: {{ .Values.timeline.port | quote }}
  DATABASE_NAME: {{ .Values.mongo.database | quote }}
  RUST_LOG: {{ .Values.timeline.rustLog | quote }}
  RUST_BACKTRACE: "1"
  AWS_REGION: {{ .Values.timeline.aws.region | quote }}
  AWS_WORKOUT_BUCKET: {{ .Values.timeline.aws.bucket | quote }}
  CLOUDFRONT_KEY_PAIR_ID: {{ .Values.timeline.aws.cloudfrontKeyPairId | quote }}
  CLOUDFRONT_DOMAIN: {{ .Values.timeline.aws.cloudfrontDomain | quote }}
  # integration is reached over TLS at its in-cluster Service DNS name; the
  # dev cert generated by scripts/gen-dev-certs.sh carries this name in its SAN.
  GRPC_PROTOCOL: "https"
  GRPC_HOST: "integration"
  GRPC_DOMAIN_NAME: "integration"
  GRPC_PORT: {{ .Values.integration.port | quote }}
  GRPC_USE_TLS: "true"
  GRPC_CERT_PATH: /etc/grpc/certs/server.crt

apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.serviceType }}
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.httpPort }}
      targetPort: http
      {{- if and (ne .Values.gateway.serviceType "ClusterIP") .Values.gateway.httpNodePort }}
      nodePort: {{ .Values.gateway.httpNodePort }}
      {{- end }}
    - name: https
      port: {{ .Values.gateway.httpsPort }}
      targetPort: https
      {{- if and (ne .Values.gateway.serviceType "ClusterIP") .Values.gateway.httpsNodePort }}
      nodePort: {{ .Values.gateway.httpsNodePort }}
      {{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
data:
  # Adapted from infra/dev/nginx.conf: same routing, but upstreams point at
  # in-cluster Service DNS names instead of host.docker.internal.
  nginx.conf: |
    events { worker_connections 1024; }

    http {
        sendfile on;

        upstream workout_service {
            server workout:{{ .Values.workout.port }};
        }

        upstream timeline_service {
            server timeline:{{ .Values.timeline.port }};
        }

        upstream login_service {
            server workout:{{ .Values.workout.port }};
        }

        upstream grpc_integration_service {
            server integration:{{ .Values.integration.port }};
        }

        server {
            listen 80;
            listen [::]:80;
            server_name _;
            return 301 https://$host$request_uri;
        }

        server {
            listen 443 ssl;
            listen [::]:443 ssl;
            http2 on;   # obrigatório para gRPC: sem isso o ALPN só oferece http/1.1
            server_name _;

            ssl_certificate /etc/nginx/certs/server.crt;
            ssl_certificate_key /etc/nginx/certs/server.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            ssl_prefer_server_ciphers on;

            location /login {
                proxy_pass http://login_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /signup {
                proxy_pass http://login_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /auth/ {
                proxy_pass http://login_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /workout/api/ {
                proxy_pass http://workout_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /timeline/api/ {
                proxy_pass http://timeline_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /grpc. {
                grpc_pass grpcs://grpc_integration_service;
                grpc_ssl_verify off;
                grpc_set_header Host $host;
            }
        }
    }

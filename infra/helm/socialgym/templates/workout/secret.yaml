apiVersion: v1
kind: Secret
metadata:
  name: workout
  labels:
    {{- include "socialgym.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Empty by default - avatar/cover upload and CloudFront-signed URLs won't
  # work locally unless you override these with real AWS credentials
  # (--set workout.aws.accessKeyId=... etc, see the chart README).
  AWS_ACCESS_KEY_ID: {{ .Values.workout.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.workout.aws.secretAccessKey | quote }}
  PRIVATE_KEY_RAW: {{ .Values.workout.aws.privateKeyRaw | quote }}

events { worker_connections 1024; }

http {
    # Configurações básicas
    sendfile on;

    upstream workout_service {
        server workout-app:8090;
    }

    # Exemplo de como você adicionaria o novo microserviço futuramente
    upstream timeline_service {
       server timeline-app:8091;
    }

    upstream login_service {
       server workout-app:8090;
    }

    upstream grpc_integration_service {
        server integration-app:50051; # Tonic gRPC server (integration-app), not workout-app
    }

    server {
        listen 80;
        listen [::]:80;
        server_name 192.168.15.4 scrutiny-elevator-washstand.ngrok-free.dev localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;   # obrigatório para gRPC: sem isso o ALPN só oferece http/1.1
        server_name 192.168.15.4 scrutiny-elevator-washstand.ngrok-free.dev localhost;

        # Caminhos dos certificados dentro do contêiner do Nginx (ou da sua máquina Linux)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Configurações recomendadas de segurança para o TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Rota para o microserviço atual (Workout)
        location /login {
            proxy_pass http://login_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota para o microserviço atual (Workout)
        location /signup {
            proxy_pass http://login_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://login_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota para o microserviço atual (Workout)
        location /workout/api/ {
            proxy_pass http://workout_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exemplo de rota para o novo microserviço
        location /timeline/api/ {
           proxy_pass http://timeline_service;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rota catch-all para TODOS os serviços gRPC
        # Qualquer requisição que comece com /grpc. será roteada para o backend gRPC
        # Isso cobre: /grpc.person.PersonService/, /grpc.friend.FriendService/, etc.
        location /grpc. {
            grpc_pass grpcs://grpc_integration_service;
            grpc_ssl_verify off;
            grpc_set_header Host $host;
        }
    }
}
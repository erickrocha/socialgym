x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
#   --- GATEWAY (INGRESS) ---
  gateway:
    image: nginx:alpine
    container_name: workout_prod_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - workout-app
      - timeline-app
      - integration-app
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--no-check-certificate", "--spider", "https://localhost:443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging: *default-logging

  postgres:
    image: postgis/postgis:18-3.6
    container_name: workout_prod_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${WORKOUT_DATABASE_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *default-logging

  workout-app:
    image: workout-app:1.0.0
    build:
      context: ../../workout
      dockerfile: Dockerfile
    container_name: workout_prod_app
    environment:
      - HOST=${WORKOUT_HOST}
      - PORT=${WORKOUT_PORT}
      - DATABASE_NAME=${WORKOUT_DATABASE_NAME}
      - DATABASE_URL=${WORKOUT_DATABASE_URL}
      - AWS_WORKOUT_BUCKET=${WORKOUT_AWS_WORKOUT_BUCKET}
      - AWS_ACCESS_KEY_ID=${WORKOUT_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${WORKOUT_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${WORKOUT_AWS_REGION:?WORKOUT_AWS_REGION must be explicitly set}
      - AWS_SQS_QUEUE_URL=${WORKOUT_AWS_SQS_QUEUE_URL}
      - RUST_BACKTRACE=1
      - RUST_LOG=${WORKOUT_RUST_LOG:-info}
      - CLOUDFRONT_KEY_PAIR_ID=${WORKOUT_CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_DOMAIN=${WORKOUT_CLOUDFRONT_DOMAIN}
      # Shared across workout-app, integration-app and timeline-app — must match or JWTs fail with 401.
      - ACCESS_TOKEN_SECRET=${AUTH_ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${AUTH_REFRESH_TOKEN_SECRET}
      - PRIVATE_KEY_RAW=${WORKOUT_PRIVATE_KEY_RAW}
      - TERMS_VERSION=${TERMS_VERSION:-1.0.0}
      - PRIVACY_VERSION=${PRIVACY_VERSION:-1.0.0}
      - HEALTH_DATA_CONSENT_VERSION=${HEALTH_DATA_CONSENT_VERSION:-1.0.0}
      - TIMELINE_BASE_URL=${TIMELINE_BASE_URL:-http://timeline-app:8091}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      - ACCOUNT_DELETION_GRACE_DAYS=${ACCOUNT_DELETION_GRACE_DAYS:-30}
      - ACCOUNT_PURGE_INTERVAL_SECONDS=${ACCOUNT_PURGE_INTERVAL_SECONDS:-900}
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging

  integration-app:
    image: integration-app:1.0.0
    build:
      context: ../../workout
      dockerfile: integration/Dockerfile
    container_name: integration_prod_app
    environment:
      - DATABASE_URL=${WORKOUT_DATABASE_URL}
      - HOST=${INTEGRATION_HOST}
      - GRPC_PORT=${GRPC_PORT}
      - TLS_CERT_PATH=${INTEGRATION_TLS_CERT_PATH}
      - TLS_KEY_PATH=${INTEGRATION_TLS_KEY_PATH}
#      - RUST_LOG=info,tonic=debug,rustls=trace,hyper=debug
      - RUST_LOG=info
      - RUST_BACKTRACE=full
      # S3/CloudFront — needed by GetPersonImageUploadUrl / DeletePersonImage gRPC methods
      # (ImageStorageUseCase::generate_presigned_url does env::var(...).expect(...), so a
      # missing var panics the request task and the gateway returns 502).
      - AWS_WORKOUT_BUCKET=${WORKOUT_AWS_WORKOUT_BUCKET}
      - AWS_ACCESS_KEY_ID=${WORKOUT_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${WORKOUT_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${WORKOUT_AWS_REGION:?WORKOUT_AWS_REGION must be explicitly set}
      - CLOUDFRONT_KEY_PAIR_ID=${WORKOUT_CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_DOMAIN=${WORKOUT_CLOUDFRONT_DOMAIN}
      - PRIVATE_KEY_RAW=${WORKOUT_PRIVATE_KEY_RAW}
      # Shared across workout-app, integration-app and timeline-app — must match or JWTs fail with 401.
      - ACCESS_TOKEN_SECRET=${AUTH_ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${AUTH_REFRESH_TOKEN_SECRET}
    volumes:
      - ../certs/server.crt:/etc/grpc/certs/server.crt:ro
      - ../certs/server.key:/etc/grpc/certs/server.key:ro # O integration app needs the TLS key to serve gRPC securely
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging: *default-logging

  timeline-app:
    image: timeline-app:1.0.0
    build:
      context: ../../timeline
      dockerfile: Dockerfile
    container_name: timeline_prod_app
    environment:
      - HOST=${TIMELINE_HOST}
      - PORT=${TIMELINE_PORT}
      - DATABASE_NAME=${TIMELINE_DATABASE_NAME}
      - DATABASE_URL=${TIMELINE_DATABASE_URL}
      - AWS_WORKOUT_BUCKET=${TIMELINE_AWS_WORKOUT_BUCKET}
      - AWS_ACCESS_KEY_ID=${TIMELINE_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${TIMELINE_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${TIMELINE_AWS_REGION:?TIMELINE_AWS_REGION must be explicitly set}
      - RUST_BACKTRACE=1
#      - RUST_LOG=info,tonic=debug,rustls=trace,hyper=debug
      - RUST_LOG=info
      - CLOUDFRONT_KEY_PAIR_ID=${TIMELINE_CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_DOMAIN=${TIMELINE_CLOUDFRONT_DOMAIN}
      # Shared across workout-app, integration-app and timeline-app — must match or JWTs fail with 401.
      - ACCESS_TOKEN_SECRET=${AUTH_ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${AUTH_REFRESH_TOKEN_SECRET}
      - PRIVATE_KEY_RAW=${TIMELINE_PRIVATE_KEY_RAW}
      - GRPC_PROTOCOL=${GRPC_PROTOCOL}
      - GRPC_HOST=${GRPC_HOST}
      - GRPC_DOMAIN_NAME=${GRPC_DOMAIN_NAME}
      - GRPC_PORT=${GRPC_PORT}
      - GRPC_USE_TLS=${GRPC_USE_TLS}
      - GRPC_CERT_PATH=${GRPC_CERT_PATH}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
    volumes:
      - ../certs/server.crt:/etc/grpc/certs/server.crt:ro
    networks:
      - edge
      - data
    depends_on:
      mongo:
        condition: service_healthy
      integration-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging

  mongo:
    hostname: mongo_database
    image: mongo:8.2
    container_name: timeline_prod_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      # Must match TIMELINE_DATABASE_NAME so the app user is created in the db the app uses.
      MONGODB_DATABASE: ${TIMELINE_DATABASE_NAME}
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mongosh mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@localhost:27017/admin --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging: *default-logging

volumes:
  postgres_data:
  mongodb_data:

networks:
  # Reachable by the gateway and by everything the gateway proxies to.
  # Has normal outbound internet access (needed for AWS SDK calls).
  edge:
    driver: bridge
  # Database tier. internal: true means no route to the outside world at
  # all - only containers attached to this network can reach postgres/mongo,
  # and the gateway is deliberately NOT attached to it.
  data:
    driver: bridge
    internal: true
